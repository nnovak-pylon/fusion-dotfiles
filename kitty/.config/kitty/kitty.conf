#font_family Source Code Pro
#font_family Minecraft Mono
font_family IBM Plex Mono
font_size 14.0

# Gnome-shell style alt+tab number
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

# Open new tabs in the same working directory
map ctrl+shift+t new_tab_with_cwd

map super+t new_tab_with_cwd

# When on wayland remove the unsightly title bar
linux_display_server x11

# Make sure all the colors are enabled
term xterm-256color

# Disable beeps
enable_audio_bell no

# Make the shell behave like normal in SSH and other contexts
# shell_integration disabled

# Based on https://github.com/morhetz/gruvbox by morhetz <morhetz@gmail.com>
# Adapted to kitty by wdomitrz <witekdomitrz@gmail.com>

